[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-ai-platform"
version = "0.1.0"
description = "Production-grade multi-agent AI platform with Temporal orchestration"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AI Platform Team"},
]

dependencies = [
  # FastAPI & Web
  "fastapi>=0.104.0",
  "uvicorn[standard]>=0.24.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",

  # Temporal SDK
  "temporalio>=1.3.0",

  # Database & ORM
  "sqlalchemy[asyncio]>=2.0.0",
  "psycopg[binary]>=3.1.0",
  "pgvector>=0.2.0",
  "alembic>=1.12.0",

  # Redis
  "redis>=5.0.0",

  # Kafka
  "confluent-kafka>=2.3.0",

  # LLM Integration
  "litellm>=1.0.0",
  "openai>=1.0.0",
  "anthropic>=0.7.0",

  # Observability
  "langfuse>=2.0.0",
  "opentelemetry-api>=1.20.0",
  "opentelemetry-sdk>=1.20.0",
  "opentelemetry-instrumentation>=0.41b0",
  "prometheus-client>=0.18.0",

  # Web Tools
  "httpx>=0.25.0",
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",

  # Utilities
  "python-dotenv>=1.0.0",
  "python-dateutil>=2.8.0",
  "pytz>=2023.3",
  "PyYAML>=6.0",
  "loguru>=0.7.0",

  # Testing
  "pytest>=7.4.0",
  "pytest-asyncio>=0.21.0",
  "pytest-cov>=4.1.0",
  "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
]
frontend = [
    "streamlit>=1.28.0",  # Optional: for quick UI prototyping
]

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=html --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]
